<style>
  :root{
    --ink:#171A26;
    --ink-soft:#4A4E60;
    --paper:#F6F7F4;
    --card:#FFFFFF;
    --brand-green:#148A45;
    --brand-green-soft:#25D366;
    --brand-orange:#F88F33;
    --tape:#F88F33;
    --line:#E2E3DD;
    --radius:14px;
    --header-bg:#171A26;
    --icon-bg:linear-gradient(145deg,#FFFFFF,#EFF1EC);
    --icon-shadow:0 2px 4px rgba(23,26,38,.10), inset 0 1px 0 #fff;
  }
  html[data-theme="dark"]{
    --ink:#EEF0F6;
    --ink-soft:#9AA0B4;
    --paper:#0F1119;
    --card:#191C28;
    --line:#2B2F3F;
    --header-bg:#080A11;
    --icon-bg:linear-gradient(145deg,#262A38,#1B1E2A);
    --icon-shadow:0 2px 6px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Heebo',sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }

  /* ===== פס עליון בסגנון תווית משלוח ===== */
  header{
    background:var(--header-bg);
    color:#fff;
    padding:0;
    border-bottom:6px solid var(--tape);
  }
  .header-inner{
    max-width:1240px;
    margin:0 auto;
    padding:26px 28px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:16px}
  .brand-logo{
    height:58px;
    width:auto;
    display:block;
  }
  .brand-eyebrow{
    font-family:'Rubik',sans-serif;
    font-weight:900;
    font-size:13px;
    letter-spacing:2.5px;
    color:var(--brand-green-soft);
  }
  .brand-eyebrow span{color:var(--brand-orange)}
  .brand-text h1{
    font-family:'Rubik',sans-serif;
    font-weight:700;
    font-size:26px;
    line-height:1.1;
  }
  .brand-text p{
    color:#B8BCCB;
    font-size:14px;
    font-weight:300;
    margin-top:3px;
  }
  .header-art{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
  }
  .header-art svg{display:block}
  .header-art .art-caption{
    font-family:'Space Mono',monospace;
    font-size:10px;
    letter-spacing:2px;
    color:#8A8FA3;
  }
  @keyframes floatCap{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-4px)}
  }
  .header-art .cap{animation:floatCap 3.5s ease-in-out infinite;transform-origin:center}
  @media (prefers-reduced-motion:reduce){.header-art .cap{animation:none}}

  /* ===== מבנה עמוד ===== */
  .layout{
    max-width:1240px;
    margin:0 auto;
    padding:32px 28px 80px;
    display:grid;
    grid-template-columns:270px 1fr;
    gap:32px;
    align-items:start;
  }

  /* ===== חוצצים בצד ===== */
  nav.topics{
    position:sticky;
    top:24px;
  }
  .topics-label{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:2px;
    margin-bottom:12px;
    padding-right:4px;
  }
  .topic-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    width:100%;
    text-align:right;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:15px 18px;
    margin-bottom:10px;
    cursor:pointer;
    font-family:'Heebo',sans-serif;
    font-size:15.5px;
    font-weight:500;
    color:var(--ink);
    transition:border-color .15s, transform .15s, box-shadow .15s;
  }
  .topic-btn:hover{border-color:var(--brand-green);transform:translateX(-3px)}
  .topic-btn:focus-visible{outline:3px solid var(--brand-green);outline-offset:2px}
  .topic-btn.active{
    background:var(--brand-green);
    border-color:var(--brand-green);
    color:#fff;
    box-shadow:4px 4px 0 var(--tape);
  }
  .btn-label{display:flex;align-items:center;gap:11px;min-width:0}
  .topic-icon{
    flex:0 0 auto;
    width:38px;height:38px;
    display:grid;place-items:center;
    border-radius:11px;
    background:var(--icon-bg);
    box-shadow:var(--icon-shadow);
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .topic-icon svg{width:25px;height:25px;display:block}
  .topic-btn:hover .topic-icon{transform:translateY(-2px) scale(1.05);box-shadow:0 5px 10px rgba(23,26,38,.16)}
  .topic-btn.active .topic-icon{
    background:var(--icon-bg);
    box-shadow:0 3px 8px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .topic-btn.soon .topic-icon{
    background:transparent;
    border:1px dashed var(--line);
    box-shadow:none;
    opacity:.75;
  }
  .head-icon{
    display:inline-grid;place-items:center;
    width:52px;height:52px;
    border-radius:15px;
    background:var(--icon-bg);
    box-shadow:var(--icon-shadow);
    vertical-align:middle;
    margin-left:14px;
  }
  .head-icon svg{width:33px;height:33px;display:block}
  .panel-head h2{display:flex;align-items:center}
  .topic-btn .count{
    font-family:'Space Mono',monospace;
    font-size:11px;
    background:var(--paper);
    color:var(--ink-soft);
    border-radius:20px;
    padding:2px 9px;
    min-width:28px;
    text-align:center;
  }
  .topic-btn.active .count{background:rgba(255,255,255,.18);color:#fff}
  .topic-btn.soon{
    border-style:dashed;
    color:var(--ink-soft);
    background:transparent;
  }
  .topic-btn.soon:hover{transform:none;border-color:var(--line);cursor:default}
  .topic-btn.soon .count{background:transparent;border:1px dashed var(--line)}

  /* ===== אזור התוכן ===== */
  .panel{display:none;animation:fadeUp .35s ease}
  .panel.visible{display:block}
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .panel{animation:none}
    .topic-btn{transition:none}
    html{scroll-behavior:auto}
  }

  .panel-head{margin-bottom:24px}
  .panel-head h2{
    font-family:'Rubik',sans-serif;
    font-weight:900;
    font-size:32px;
    line-height:1.15;
  }
  .panel-head p{
    color:var(--ink-soft);
    font-size:16px;
    margin-top:8px;
    max-width:640px;
    font-weight:300;
  }

  .video-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(340px, 1fr));
    gap:22px;
  }
  .video-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }
  .video-frame{
    position:relative;
    aspect-ratio:16/9;
    background:var(--ink);
  }
  .video-frame iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:0;
  }
  .video-placeholder{
    position:absolute;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    color:#8A8FA3;
    background:
      repeating-linear-gradient(45deg, transparent 0 14px, rgba(255,255,255,.03) 14px 28px),
      var(--ink);
  }
  .video-placeholder .badge{
    font-family:'Space Mono',monospace;
    font-size:11px;
    letter-spacing:2px;
    border:1px dashed #4A4E60;
    padding:6px 14px;
  }
  .video-placeholder svg{opacity:.5}
  .video-meta{
    padding:16px 18px 18px;
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:1;
  }
  .video-meta h3{
    font-family:'Rubik',sans-serif;
    font-weight:700;
    font-size:17px;
  }
  .video-meta p{
    color:var(--ink-soft);
    font-size:14px;
    font-weight:300;
    line-height:1.5;
  }
  .video-num{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--brand-green);
    letter-spacing:1px;
  }

  .empty-topic{
    border:2px dashed var(--line);
    border-radius:var(--radius);
    padding:60px 30px;
    text-align:center;
    color:var(--ink-soft);
  }
  .empty-topic strong{
    display:block;
    font-family:'Rubik',sans-serif;
    font-size:19px;
    color:var(--ink);
    margin-bottom:6px;
  }

  /* ===== מובייל ===== */
  @media (max-width:860px){
    .layout{grid-template-columns:1fr;padding:22px 16px 60px;gap:20px}
    nav.topics{
      position:static;
      display:flex;
      gap:10px;
      overflow-x:auto;
      padding-bottom:6px;
      -webkit-overflow-scrolling:touch;
    }
    .topics-label{display:none}
    .topic-btn{
      margin-bottom:0;
      white-space:nowrap;
      width:auto;
      flex:0 0 auto;
      padding:12px 16px;
    }
    .header-inner{padding:20px 16px}
    .header-art{display:none}
    .brand-logo{height:46px}
    .panel-head h2{font-size:26px}
  }

  body{transition:background .25s ease, color .25s ease}
  .theme-toggle{
    display:flex;align-items:center;gap:8px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);
    color:#fff;
    border-radius:30px;
    padding:9px 16px;
    cursor:pointer;
    font-family:'Heebo',sans-serif;
    font-size:13.5px;
    font-weight:500;
    transition:background .15s, border-color .15s;
  }
  .theme-toggle:hover{background:rgba(255,255,255,.15);border-color:var(--brand-orange)}
  .theme-toggle:focus-visible{outline:3px solid var(--brand-green-soft);outline-offset:2px}
  .theme-toggle svg{width:17px;height:17px;flex:0 0 auto}
  .header-right{display:flex;align-items:center;gap:22px}
  @media (max-width:860px){
    .header-right{gap:0}
    .theme-toggle{padding:8px 13px;font-size:12.5px}
  }

  /* ===== אפקטים וחיים ===== */

  /* רקע עדין ונושם מאחורי הדף */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    background:
      radial-gradient(620px circle at 12% 8%,  rgba(37,211,102,.10), transparent 62%),
      radial-gradient(560px circle at 88% 78%, rgba(248,143,51,.09), transparent 60%);
    animation:breathe 9s ease-in-out infinite;
  }
  @keyframes breathe{
    0%,100%{transform:scale(1) translateY(0);opacity:1}
    50%{transform:scale(1.12) translateY(-14px);opacity:.72}
  }

  /* פס כתום נע בתחתית הכותרת */
  header{position:relative;overflow:hidden}
  header::after{
    content:"";
    position:absolute;
    bottom:-6px;left:-40%;
    width:40%;height:6px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);
    animation:sweep 6s ease-in-out infinite;
  }
  @keyframes sweep{
    0%{left:-40%}
    55%,100%{left:120%}
  }

  /* כניסה מדורגת של כרטיסי הסרטונים */
  .panel.visible .video-card{
    opacity:0;
    animation:cardIn .5s cubic-bezier(.22,.9,.3,1) forwards;
  }
  .panel.visible .video-card:nth-child(1){animation-delay:.04s}
  .panel.visible .video-card:nth-child(2){animation-delay:.11s}
  .panel.visible .video-card:nth-child(3){animation-delay:.18s}
  .panel.visible .video-card:nth-child(4){animation-delay:.25s}
  .panel.visible .video-card:nth-child(5){animation-delay:.32s}
  .panel.visible .video-card:nth-child(n+6){animation-delay:.38s}
  @keyframes cardIn{
    from{opacity:0;transform:translateY(22px) scale(.97)}
    to{opacity:1;transform:none}
  }

  /* הרמת כרטיס במעבר עכבר */
  .video-card{
    transition:transform .28s cubic-bezier(.22,.9,.3,1), box-shadow .28s ease, border-color .28s ease;
  }
  .video-card:hover{
    transform:translateY(-6px);
    border-color:var(--brand-green-soft);
    box-shadow:0 14px 32px rgba(23,26,38,.16);
  }
  html[data-theme="dark"] .video-card:hover{box-shadow:0 14px 34px rgba(0,0,0,.55)}

  /* פס ירוק-כתום שנפתח בראש הכרטיס */
  .video-card{position:relative}
  .video-card::before{
    content:"";
    position:absolute;
    top:0;right:0;left:0;
    height:3px;
    background:linear-gradient(90deg,var(--brand-green-soft),var(--brand-orange));
    transform:scaleX(0);
    transform-origin:right;
    transition:transform .35s cubic-bezier(.22,.9,.3,1);
    z-index:2;
  }
  .video-card:hover::before{transform:scaleX(1)}

  /* פעימה עדינה על כפתור הניגון של סרטון שממתין */
  .video-placeholder svg{animation:pulse 2.8s ease-in-out infinite}
  @keyframes pulse{
    0%,100%{transform:scale(1);opacity:.5}
    50%{transform:scale(1.09);opacity:.85}
  }

  /* כותרת הנושא נכנסת בהחלקה */
  .panel.visible .panel-head{animation:headIn .45s ease both}
  @keyframes headIn{
    from{opacity:0;transform:translateX(18px)}
    to{opacity:1;transform:none}
  }

  /* ניצוץ קל על האייקון בכותרת */
  .head-icon{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
  .panel-head h2:hover .head-icon{transform:rotate(-7deg) scale(1.07)}

  /* מונה הסרטונים קופץ קלות בהפעלה */
  .topic-btn.active .count{animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
  @keyframes pop{
    0%{transform:scale(.6)}
    60%{transform:scale(1.18)}
    100%{transform:scale(1)}
  }

  /* לחיצה על חוצץ */
  .topic-btn:active{transform:scale(.985)}

  /* כיבוי מלא למי שביקש להפחית תנועה */
  @media (prefers-reduced-motion:reduce){
    body::before, header::after,
    .video-placeholder svg, .panel.visible .video-card,
    .panel.visible .panel-head, .topic-btn.active .count{animation:none !important}
    .panel.visible .video-card{opacity:1}
    .video-card:hover{transform:none}
  }

  /* ===== באנר חי ===== */

  /* שכבת חלקיקים מרחפים ברקע הכותרת */
  .hdr-particles{
    position:absolute;
    inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .hdr-particles i{
    position:absolute;
    display:block;
    border-radius:50%;
    background:var(--brand-green-soft);
    opacity:0;
    animation:floatUp linear infinite;
  }
  .hdr-particles i:nth-child(even){background:var(--brand-orange)}
  @keyframes floatUp{
    0%{transform:translateY(0) scale(.6);opacity:0}
    12%{opacity:1}
    80%{opacity:.8}
    100%{transform:translateY(-150px) scale(1.05);opacity:0}
  }

  /* הילות צבע נעות מאחורי הכותרת */
  .hdr-glow{
    position:absolute;
    inset:-40% -10%;
    z-index:0;
    pointer-events:none;
    background:
      radial-gradient(380px circle at 20% 60%, rgba(37,211,102,.38), transparent 65%),
      radial-gradient(340px circle at 78% 35%, rgba(248,143,51,.34), transparent 62%);
    animation:glowDrift 8s ease-in-out infinite alternate;
    filter:blur(4px);
  }
  @keyframes glowDrift{
    0%{transform:translate(0,0) scale(1)}
    100%{transform:translate(6%, 8%) scale(1.15)}
  }

  /* התוכן מעל השכבות */
  .header-inner{position:relative;z-index:2}

  /* הלוגו נושם ומקבל זוהר */
  .brand-logo{
    animation:logoFloat 5s ease-in-out infinite;
    filter:drop-shadow(0 0 0 rgba(37,211,102,0));
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes logoFloat{
    0%,100%{transform:translateY(0) rotate(0deg)}
    50%{transform:translateY(-6px) rotate(-2deg)}
  }
  .brand-logo:hover{transform:scale(1.08) rotate(3deg)}

  /* השם מקבל ברק חולף */
  .brand-eyebrow{
    background:linear-gradient(100deg,var(--brand-green-soft) 0%,var(--brand-green-soft) 38%,#FFFFFF 48%,var(--brand-orange) 58%,var(--brand-orange) 100%);
    background-size:260% 100%;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:shine 7s ease-in-out infinite;
  }
  .brand-eyebrow span{color:inherit}
  @keyframes shine{
    0%,70%{background-position:100% 0}
    100%{background-position:0 0}
  }

  /* ניצוצות סביב כובע הסיום */
  .header-art .spark{
    transform-origin:center;
    animation:twinkle 2.6s ease-in-out infinite;
  }
  .header-art .spark:nth-of-type(2){animation-delay:.9s}
  .header-art .spark:nth-of-type(3){animation-delay:1.7s}
  .header-art .spark:nth-of-type(4){animation-delay:.4s}
  @keyframes twinkle{
    0%,100%{opacity:.15;transform:scale(.6) rotate(0deg)}
    50%{opacity:1;transform:scale(1.25) rotate(90deg)}
  }

  /* המדרגות עולות בטעינה */
  .header-art .step{animation:stepUp .7s cubic-bezier(.22,.9,.3,1) both}
  .header-art .step:nth-of-type(2){animation-delay:.12s}
  .header-art .step:nth-of-type(3){animation-delay:.24s}
  @keyframes stepUp{
    from{transform:translateY(26px);opacity:0}
    to{transform:none;opacity:1}
  }

  /* טבעת פועמת סביב כפתור הניגון שבאיור */
  .header-art .ring{
    transform-origin:109px 92px;
    animation:ringPulse 2.4s ease-out infinite;
  }
  @keyframes ringPulse{
    0%{transform:scale(.75);opacity:.85}
    75%,100%{transform:scale(1.9);opacity:0}
  }

  @media (prefers-reduced-motion:reduce){
    .hdr-particles,.hdr-glow{display:none}
    .brand-logo,.brand-eyebrow,.header-art .spark,
    .header-art .step,.header-art .ring{animation:none !important}
    .brand-eyebrow{-webkit-text-fill-color:initial;color:var(--brand-green-soft)}
  }

  /* ===== הנפשת רקע כללית ===== */

  /* שכבה 2: רשת עדינה שנעה באלכסון */
  body::after{
    content:"";
    position:fixed;
    inset:-50px;
    z-index:-2;
    pointer-events:none;
    opacity:.8;
    background-image:
      linear-gradient(to left, rgba(20,138,69,.13) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(20,138,69,.13) 1px, transparent 1px);
    background-size:52px 52px;
    animation:gridDrift 18s linear infinite;
    -webkit-mask-image:radial-gradient(circle at 50% 40%, #000 20%, transparent 78%);
    mask-image:radial-gradient(circle at 50% 40%, #000 20%, transparent 78%);
  }
  @keyframes gridDrift{
    from{background-position:0 0, 0 0}
    to{background-position:-52px 52px, -52px 52px}
  }
  html[data-theme="dark"] body::after{opacity:.7}

  /* שכבה 3: כדורי אור עצלים שמרחפים על פני כל הדף */
  .bg-orbs{
    position:fixed;
    inset:0;
    z-index:-1;
    pointer-events:none;
    overflow:hidden;
  }
  .bg-orbs span{
    position:absolute;
    border-radius:50%;
    filter:blur(38px);
    opacity:.55;
    will-change:transform;
  }
  html[data-theme="dark"] .bg-orbs span{opacity:.40;filter:blur(46px)}

  .bg-orbs span:nth-child(1){
    width:420px;height:420px;top:8%;right:-70px;
    background:radial-gradient(circle,#25D366,transparent 70%);
    animation:drift1 16s ease-in-out infinite;
  }
  .bg-orbs span:nth-child(2){
    width:340px;height:340px;top:46%;left:-60px;
    background:radial-gradient(circle,#F88F33,transparent 70%);
    animation:drift2 20s ease-in-out infinite;
  }
  .bg-orbs span:nth-child(3){
    width:260px;height:260px;bottom:6%;right:26%;
    background:radial-gradient(circle,#25D366,transparent 70%);
    animation:drift3 18s ease-in-out infinite;
  }
  .bg-orbs span:nth-child(4){
    width:160px;height:160px;top:26%;left:34%;
    background:radial-gradient(circle,#F88F33,transparent 70%);
    animation:drift4 22s ease-in-out infinite;
  }
  @keyframes drift1{
    0%,100%{transform:translate(0,0) scale(1)}
    33%{transform:translate(-70px,60px) scale(1.14)}
    66%{transform:translate(-30px,140px) scale(.92)}
  }
  @keyframes drift2{
    0%,100%{transform:translate(0,0) scale(1)}
    40%{transform:translate(90px,-70px) scale(1.2)}
    70%{transform:translate(40px,50px) scale(.95)}
  }
  @keyframes drift3{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(-90px,-60px) scale(1.25)}
  }
  @keyframes drift4{
    0%,100%{transform:translate(0,0) scale(1)}
    35%{transform:translate(60px,80px) scale(.85)}
    75%{transform:translate(-50px,30px) scale(1.15)}
  }

  @media (prefers-reduced-motion:reduce){
    body::after{animation:none}
    .bg-orbs{display:none}
  }
  @media (max-width:860px){
    .bg-orbs span:nth-child(4){display:none}
  }

  /* ===== שורת חיפוש ===== */
  .search-wrap{
    position:relative;
    margin-bottom:22px;
  }
  .search-box{
    display:flex;
    align-items:center;
    gap:11px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:30px;
    padding:12px 18px;
    transition:border-color .18s, box-shadow .18s;
  }
  .search-box:focus-within{
    border-color:var(--brand-green);
    box-shadow:0 0 0 4px rgba(37,211,102,.15);
  }
  .search-box svg{width:19px;height:19px;color:var(--ink-soft);flex:0 0 auto}
  .search-box input{
    flex:1;
    border:0;
    outline:0;
    background:transparent;
    font-family:'Heebo',sans-serif;
    font-size:15.5px;
    color:var(--ink);
    min-width:0;
  }
  .search-box input::placeholder{color:var(--ink-soft);opacity:.85}
  .search-clear{
    border:0;
    background:var(--paper);
    color:var(--ink-soft);
    width:24px;height:24px;
    border-radius:50%;
    cursor:pointer;
    display:none;
    place-items:center;
    font-size:15px;
    line-height:1;
    flex:0 0 auto;
    transition:background .15s,color .15s;
  }
  .search-clear:hover{background:var(--brand-orange);color:#fff}
  .search-clear.on{display:grid}

  /* תצוגת תוצאות */
  #searchResults{display:none}
  #searchResults.on{display:block}
  body.searching .panel{display:none !important}

  .search-status{
    font-size:14px;
    color:var(--ink-soft);
    margin-bottom:16px;
  }
  .search-status b{color:var(--brand-green);font-weight:600}
  .result-topic{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:500;
    color:var(--brand-green);
    background:rgba(37,211,102,.12);
    border-radius:20px;
    padding:3px 11px;
    margin-bottom:4px;
    align-self:flex-start;
  }
  mark{
    background:rgba(248,143,51,.35);
    color:inherit;
    border-radius:3px;
    padding:0 2px;
  }
  .no-results{
    border:2px dashed var(--line);
    border-radius:var(--radius);
    padding:54px 26px;
    text-align:center;
    color:var(--ink-soft);
  }
  .no-results strong{
    display:block;
    font-family:'Rubik',sans-serif;
    font-size:19px;
    color:var(--ink);
    margin-bottom:6px;
  }

  /* ===== תיבת פרטים מתחת לסרטון ===== */
  .video-details{
    margin-top:12px;
    background:linear-gradient(180deg, rgba(37,211,102,.09), rgba(248,143,51,.07));
    border:1px solid var(--line);
    border-right:4px solid var(--brand-green);
    border-radius:10px;
    padding:12px 14px;
  }
  .video-details .vd-title{
    display:flex;align-items:center;gap:7px;
    font-family:'Rubik',sans-serif;
    font-weight:700;
    font-size:13.5px;
    color:var(--brand-green);
    margin-bottom:8px;
  }
  .video-details .vd-title svg{width:15px;height:15px;flex:0 0 auto}
  .vd-row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    font-size:13.5px;
    padding:5px 0;
    border-bottom:1px dashed var(--line);
  }
  .vd-row:last-child{border-bottom:0}
  .vd-key{color:var(--ink-soft);font-weight:300;flex:0 0 auto}
  .vd-val{
    font-weight:600;
    color:var(--ink);
    text-align:left;
    word-break:break-word;
  }
  .vd-val.num{font-family:'Space Mono',monospace;direction:ltr;letter-spacing:.5px}

  /* קישור חיצוני בתוך תיבת הפרטים */
  .vd-link{
    display:inline-flex;
    align-items:center;
    gap:8px;
    margin-top:11px;
    background:var(--brand-green);
    color:#fff;
    text-decoration:none;
    font-size:13.5px;
    font-weight:500;
    border-radius:22px;
    padding:9px 16px;
    transition:background .16s, transform .16s, box-shadow .16s;
    box-shadow:0 2px 6px rgba(20,138,69,.28);
  }

(function(){
  const moon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.3A8.6 8.6 0 0 1 9.7 3.5a8.6 8.6 0 1 0 10.8 10.8Z"/></svg>`;
  const sun  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2 12h2.2M19.8 12H22M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg>`;
  const btn = document.getElementById("themeToggle");
  const icon = document.getElementById("themeIcon");
  const label = document.getElementById("themeLabel");
  let saved = null;
  try { saved = localStorage.getItem("cv-theme"); } catch(e){}
  const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  let theme = saved || (prefersDark ? "dark" : "light");

  function apply(t){
    document.documentElement.setAttribute("data-theme", t);
    icon.innerHTML = t === "dark" ? sun : moon;
    label.textContent = t === "dark" ? "מצב בהיר" : "מצב כהה";
    btn.setAttribute("aria-pressed", t === "dark");
    try { localStorage.setItem("cv-theme", t); } catch(e){}
  }
  apply(theme);
  btn.addEventListener("click", () => {
    theme = theme === "dark" ? "light" : "dark";
    apply(theme);
  });
})();

function detailsBlock(v){
  if((!v.details || !v.details.length) && !v.linkUrl) return "";
  const rows = (v.details || []).map(d =>
    `<div class="vd-row"><span class="vd-key">${d.key}</span><span class="vd-val${d.num ? " num" : ""}">${d.value}</span></div>`
  ).join("");
  const link = v.linkUrl
    ? `<a class="vd-link" href="${v.linkUrl}" target="_blank" rel="noopener noreferrer">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4 11 13"/><path d="M18 14.5V19a1.9 1.9 0 0 1-1.9 1.9H5A1.9 1.9 0 0 1 3.1 19V7.9A1.9 1.9 0 0 1 5 6h4.5"/></svg>
         ${v.linkText || "מעבר לקישור"}
       </a>`
    : "";
  return `<div class="video-details">
    <div class="vd-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9.2"/><path d="M12 11v5.4"/><path d="M12 7.6h.01"/></svg>${v.detailsTitle || "פרטים חשובים"}</div>
    ${rows}
    ${link}
  </div>`;
}

  btnWrap.appendChild(btn);
  if (topic.soon) return;

  // פאנל תוכן

  panel.id = "panel-" + topic.id;

  let videosHtml = "";

    videosHtml = `<div class="empty-topic"><strong>עדיין אין סרטונים בנושא הזה</strong>הסרטונים יתווספו בקרוב</div>`;
  } else {

function activate(id, btn) {
  document.querySelectorAll(".topic-btn").forEach(b => b.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p => p.classList.remove("visible"));
  btn.classList.add("active");
  document.getElementById("panel-" + id).classList.add("visible");
  const t = TOPICS.find(x => x.id === id);
  if (t) document.title = t.title + " — מרכז ההדרכה | CRAZY VENDOR";
}

function openFromHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  const btn = (id && btnWrap.querySelector(`.topic-btn[data-topic="${CSS.escape(id)}"]`))
           || btnWrap.querySelector(".topic-btn:not(.soon)");
  if (btn) activate(btn.dataset.topic, btn);
}

  if (!b) return;
  const url = location.href.split("#")[0] + "#" + b.dataset.topic;
  const label = b.querySelector("span");
  const done = () => { b.classList.add("done"); label.textContent = "הקישור הועתק ✓";
    setTimeout(() => { b.classList.remove("done"); label.textContent = "העתקת קישור"; }, 1800); };
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => prompt("העתיקו את הקישור:", url));
  else prompt("העתיקו את הקישור:", url);
});

/* ===== חיפוש סרטונים ===== */
(function(){
  const input   = document.getElementById("searchInput");
  const clearBtn= document.getElementById("searchClear");
  const results = document.getElementById("searchResults");
  if(!input) return;

  // בניית מאגר לחיפוש
  const INDEX = [];
  TOPICS.forEach(topic => {
    if(topic.soon) return;
    topic.videos.forEach((v, n) => {
      INDEX.push({
        title: v.title,
        description: v.description || "",
        youtubeId: v.youtubeId,
        topicTitle: topic.title,
        topicId: topic.id,
        topicIcon: topic.icon,
        details: v.details,
        detailsTitle: v.detailsTitle,
        linkUrl: v.linkUrl,
        linkText: v.linkText,
        num: n + 1
      });
    });
  });

  const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const norm = s => s.toLowerCase().replace(/["'׳״\-–—()]/g,"").replace(/\s+/g," ").trim();

  function highlight(text, q){
    const safe = esc(text);
    if(!q) return safe;
    const i = norm(safe).indexOf(q);
    if(i < 0) return safe;
    // התאמה משוערת על הטקסט המקורי
    const re = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + ")", "gi");
    return safe.replace(re, "<mark>$1</mark>");
  }

  function render(q){
    const nq = norm(q);
    const hits = INDEX.filter(v =>
      norm(v.title).includes(nq) ||
      norm(v.description).includes(nq) ||
      norm(v.topicTitle).includes(nq)
    );

    if(hits.length === 0){
      results.innerHTML = `<div class="no-results"><strong>לא נמצאו סרטונים</strong>נסו מילת חיפוש אחרת, או בחרו נושא מהרשימה</div>`;
      return;
    }

    const cards = hits.map(v => `
      <article class="video-card">
        <div class="video-frame">
          ${v.youtubeId
            ? `<iframe src="https://www.youtube-nocookie.com/embed/${v.youtubeId}?rel=0&controls=1&fs=1&playsinline=1" title="${esc(v.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>`
            : `<div class="video-placeholder">${ICONS.plus ? "" : ""}<span class="badge">הסרטון בדרך אליכם</span></div>`
          }
        </div>
        <div class="video-meta">
          <span class="result-topic">${esc(v.topicTitle)}</span>
          <h3>${highlight(v.title, q.trim())}</h3>
          ${v.description ? `<p>${highlight(v.description, q.trim())}</p>` : ""}
          ${detailsBlock(v)}
        </div>
      </article>`).join("");

    results.innerHTML =
      `<div class="search-status">נמצאו <b>${hits.length}</b> סרטונים עבור "${esc(q.trim())}"</div>
       <div class="video-grid">${cards}</div>`;
  }

  let t;
  function onInput(){
    const q = input.value;
    clearBtn.classList.toggle("on", q.length > 0);
    clearTimeout(t);
    t = setTimeout(() => {
      if(q.trim().length === 0){
        document.body.classList.remove("searching");
        results.classList.remove("on");
        results.innerHTML = "";
        return;
      }
      document.body.classList.add("searching");
      results.classList.add("on");
      render(q);
    }, 160);
  }

  input.addEventListener("input", onInput);
  input.addEventListener("keydown", e => { if(e.key === "Escape") reset(); });
  clearBtn.addEventListener("click", reset);

  function reset(){
    input.value = "";
    clearBtn.classList.remove("on");
    document.body.classList.remove("searching");
    results.classList.remove("on");
    results.innerHTML = "";
    input.focus();
  }

  // לחיצה על חוצץ מנקה חיפוש
  document.querySelectorAll(".topic-btn").forEach(b => b.addEventListener("click", () => {
    if(input.value) reset();
  }));
})();

</script>

</body>
